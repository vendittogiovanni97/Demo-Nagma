name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: nagmadb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U root -d nagmadb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://root:root123@localhost:5432/nagmadb_test?schema=public
      JWT_SECRET: test-jwt-secret-for-ci-purposes-only-min-32-chars-long
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
      BOOKING_UPDATE_PASSWORD: testpass123
      ADMIN_PASSWORD: admin123
      SUPER_ADMIN_PASSWORD: superadmin123
      RUN_SEEDS: true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run Prisma generate
      run: npx prisma generate

    - name: Run tests
      run: npm test -- --runInBand --forceExit --detectOpenHandles

    - name: Build applications
      run: |
        npm run build --workspace=backend
        npm run build --workspace=frontend