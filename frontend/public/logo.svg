<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <style>
      .logo-text {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 28px;
        font-weight: bold;
        fill: currentColor;
        letter-spacing: 2px;
      }
      .logo-subtitle {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 10px;
        fill: currentColor;
        letter-spacing: 3px;
        opacity: 0.8;
      }
    </style>
  </defs>
  
  <!-- Icona stilizzata tatuaggio (ago/macchina) -->
  <g transform="translate(5, 10)">
    <!-- Corpo principale -->
    <rect x="8" y="0" width="24" height="40" rx="4" fill="currentColor"/>
    <!-- Dettaglio ago -->
    <line x1="20" y1="40" x2="20" y2="50" stroke="currentColor" stroke-width="2"/>
    <!-- Linee decorative -->
    <line x1="12" y1="8" x2="28" y2="8" stroke="white" stroke-width="1.5"/>
    <line x1="12" y1="14" x2="28" y2="14" stroke="white" stroke-width="1.5"/>
    <line x1="12" y1="20" x2="28" y2="20" stroke="white" stroke-width="1.5"/>
  </g>
  
  <!-- Testo NAGMA -->
  <text x="50" y="35" class="logo-text">NAGMA</text>
  
  <!-- Sottotitolo TATTOO -->
  <text x="52" y="50" class="logo-subtitle">TATTOO</text>
</svg>
