# Questo file è mantenuto per sviluppo locale solo DB.
# Per il deploy completo usa il docker-compose.yml nella root del progetto.

services:
  postgres:
    image: postgres:17-alpine
    container_name: nagma-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nagmadb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root123
    ports:
      - '5432:5432'
    volumes:
      - nagma_data:/var/lib/postgresql/data

volumes:
  nagma_data:
