services:
  postgres:
    image: postgres:17-alpine
    container_name: nagma-postgres
    restart: unless-stopped
    environment:
      # SECURITY (Audit H4): credenziali da variabili d'ambiente, nessun valore
      # di default commesso. Impostarle in .env alla radice (vedi .env.example).
      POSTGRES_DB: ${POSTGRES_DB:-nagmadb}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER mancante in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante in .env}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - nagma_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-nagmadb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nagma_network

networks:
  nagma_network:
    driver: bridge

volumes:
  nagma_data:
    driver: local
