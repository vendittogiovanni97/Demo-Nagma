name: CI

# Pipeline unica del progetto (consolida i precedenti ci.yml + test.yml).
# Backend: lint, typecheck, unit/integration/security test, build, audit.
# Frontend: lint, typecheck, build, audit.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend — lint, typecheck, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: nagmadb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d nagmadb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://root:root123@localhost:5432/nagmadb_test?schema=public
      JWT_SECRET: test-jwt-secret-for-ci-purposes-only-min-32-chars-long
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
      BOOKING_UPDATE_PASSWORD: testpass123
      ADMIN_PASSWORD: admin123
      SUPER_ADMIN_PASSWORD: superadmin123
      RUN_SEEDS: 'true'
      INIT_CONFIG_FROM_DB: 'false'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Seed database (superadmin + config)
        run: npx tsx prisma/seed.ts

      - name: Run unit tests + coverage gate
        run: npm run test:coverage -- --forceExit

      - name: Run integration + security tests
        run: npm run test:integration -- --forceExit

      - name: Build backend
        run: npm run build

      - name: Security audit (non bloccante)
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Security audit (non bloccante)
        run: npm audit --audit-level=high
        continue-on-error: true
