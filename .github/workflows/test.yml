name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: nagmadb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U root -d nagmadb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://root:root123@localhost:5432/nagmadb_test?schema=public
      JWT_SECRET: test-jwt-secret-for-ci-purposes-only-min-32-chars-long
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
      BOOKING_UPDATE_PASSWORD: testpass123
      ADMIN_PASSWORD: admin123
      SUPER_ADMIN_PASSWORD: superadmin123
      RUN_SEEDS: true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install backend dependencies
      run: npm ci --prefix backend

    - name: Install frontend dependencies
      run: npm ci --prefix frontend

    - name: Lint frontend
      run: npm run lint --prefix frontend

    - name: Generate Prisma client
      working-directory: ./backend
      run: npx prisma generate

    - name: Run backend tests
      working-directory: ./backend
      run: npm test -- --runInBand --forceExit --detectOpenHandles

    - name: Build backend
      run: npm run build --prefix backend

    - name: Build frontend
      run: npm run build --prefix frontend