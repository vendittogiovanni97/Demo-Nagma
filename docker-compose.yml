services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:17-alpine
    container_name: backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nagmadb_}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root123}
    ports:
      - '5432:5432'
    volumes:
      - nagma_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nagma_network

  # Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root123}@postgres:5432/${POSTGRES_DB:-nagmadb_}?schema=public

      # JWT and Security
      JWT_SECRET: ${JWT_SECRET:-a3f8c2d7e1b94056f2a8c3d6e0b7f1a4c9d2e5f8b1a3c6d9e2f5a8b4c7d0e3f6}

      # Server Config
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}

      # CORS - Accept requests from frontend container
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # Debug
      DEBUG_HTTP: ${DEBUG_HTTP:-false}

      # Booking password
      BOOKING_UPDATE_PASSWORD: ${BOOKING_UPDATE_PASSWORD:-nagmatatto12}

      # Admin passwords
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Nagmatattoo1926!}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-superadmin123}
    ports:
      - '3001:3001'
    networks:
      - nagma_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagma-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Frontend-specific variables
      # NOTE: NEXT_PUBLIC_API_BASE_URL is used for:
      # 1. Server-side requests (Node.js context): http://backend:3001
      # 2. Client-side requests (Browser context): http://localhost:3001
      # This docker-compose assumes localhost for browser access.
      # For production/external access, adjust to your domain/IP.
      NEXT_PUBLIC_PORTAL_NAME: ${NEXT_PUBLIC_PORTAL_NAME:-Nagma Tattoo CRM}
      NEXT_PUBLIC_PORTAL_SHORT_NAME: ${NEXT_PUBLIC_PORTAL_SHORT_NAME:-Nagma}
      NEXT_PUBLIC_PORTAL_DESCRIPTION: ${NEXT_PUBLIC_PORTAL_DESCRIPTION:-Gestionale completo Nagma Tattoo Studio}
      NEXT_PUBLIC_PORTAL_LOGIN_TAGLINE: ${NEXT_PUBLIC_PORTAL_LOGIN_TAGLINE:-Nagma Tattoo Studio Management}
      NEXT_PUBLIC_PORTAL_LOGO: ${NEXT_PUBLIC_PORTAL_LOGO:-/logo.svg}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - '3000:3000'
    networks:
      - nagma_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  nagma_network:
    driver: bridge

volumes:
  nagma_data:
    driver: local
