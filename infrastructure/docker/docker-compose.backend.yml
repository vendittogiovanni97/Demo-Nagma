include:
  - docker-compose.db.yml

services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: nagma-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://root:root123@postgres:5432/nagmadb?schema=public
      JWT_SECRET: a3f8c2d7e1b94056f2a8c3d6e0b7f1a4c9d2e5f8b1a3c6d9e2f5a8b4c7d0e3f6
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: development
      RUN_SEEDS: true
    ports:
      - '3001:3001'
    networks:
      - nagma_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
