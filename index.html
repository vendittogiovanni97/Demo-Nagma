<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagma Tattoo | Gestionale Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Ionicons for some flair -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <main id="main-view" style="padding-top: 2rem;">
        <!-- Content will be injected here via script.js -->
    </main>

    <nav class="floating-nav">
        <div class="nav-content">
            <a href="#" class="nav-item active" data-section="dashboard">
                <ion-icon name="grid-outline"></ion-icon>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item" data-section="calendar">
                <ion-icon name="calendar-outline"></ion-icon>
                <span>Agenda</span>
            </a>
            <a href="#" class="nav-item" data-section="customers">
                <ion-icon name="people-outline"></ion-icon>
                <span>Clienti</span>
            </a>
            <a href="#" class="nav-item" data-section="artists">
                <ion-icon name="brush-outline"></ion-icon>
                <span>Team</span>
            </a>
            <a href="#" class="nav-item" data-section="finance">
                <ion-icon name="cash-outline"></ion-icon>
                <span>Spese</span>
            </a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-btn-plus" onclick="openModal('modal-booking')">
                <ion-icon name="add-outline"></ion-icon>
            </a>
        </div>
    </nav>

    <!-- Modal for New Booking -->
    <div class="modal-overlay" id="modal-booking">
        <div class="modal">
            <div class="card-header">
                <h3>Nuova Prenotazione</h3>
                <button class="btn btn-outline" onclick="closeModal('modal-booking')">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            <form id="booking-form" style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Cliente</label>
                    <input type="text" placeholder="Cerca o aggiungi cliente..." style="width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Data</label>
                        <input type="date" style="width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Ora</label>
                        <input type="time" style="width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white;">
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Artista</label>
                    <select style="width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white;">
                        <option>Mario R. (Realistico)</option>
                        <option>Sofia L. (Tradizionale)</option>
                        <option>Luca B. (Giapponese)</option>
                    </select>
                </div>
                <button type="button" class="btn btn-primary" style="margin-top: 1rem; width: 100%;" onclick="confirmBooking()">Conferma Prenotazione</button>
            </form>
        </div>
    </div>

    <!-- Modal for New Transaction -->
    <div class="modal-overlay" id="modal-finance">
        <div class="modal">
            <div class="card-header">
                <h3>Nuova Voce Spesa / Entrata</h3>
                <button class="btn btn-outline" onclick="closeModal('modal-finance')">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            <form id="finance-form" style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Descrizione</label>
                    <input type="text" id="fin-desc" placeholder="Es. Affitto, Colori, Acconto Cliente..." style="width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Importo (€)</label>
                        <input type="number" id="fin-amount" placeholder="0.00" style="width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Tipo</label>
                        <select id="fin-type" style="width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white;">
                            <option value="uscita">Spesa (Uscita)</option>
                            <option value="entrata">Entrata</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" style="margin-top: 1rem; width: 100%;" onclick="confirmTransaction()">Registra Transazione</button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" style="position: fixed; bottom: 6rem; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: black; padding: 1rem 2rem; border-radius: 12px; font-weight: 600; display: none; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        Transazione registrata!
    </div>

    <script src="script.js"></script>
</body>
</html>
