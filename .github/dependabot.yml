version: 2
updates:
  # Backend (Express / Prisma / ...)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-dev:
        dependency-type: "development"
      backend-prod:
        dependency-type: "production"

  # Frontend (Next.js / React / MUI / ...)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-dev:
        dependency-type: "development"
      frontend-prod:
        dependency-type: "production"

  # Root (tooling di orchestrazione)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
