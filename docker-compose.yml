services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:17-alpine
    container_name: backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - nagma_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nagmadb_"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nagma_network

  # Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      # JWT and Security
      JWT_SECRET: ${JWT_SECRET}

      # Server Config
      PORT: 3001
      NODE_ENV: ${NODE_ENV}

      # CORS - Accept requests from frontend container
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Debug
      DEBUG_HTTP: ${DEBUG_HTTP}

      # Booking password
      BOOKING_UPDATE_PASSWORD: ${BOOKING_UPDATE_PASSWORD}

      # Admin passwords
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
    ports:
      - '3001:3001'
    networks:
      - nagma_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagma-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Frontend-specific variables
      # NOTE: NEXT_PUBLIC_API_BASE_URL is used for:
      # 1. Server-side requests (Node.js context): http://backend:3001
      # 2. Client-side requests (Browser context): http://localhost:3001
      # This docker-compose assumes localhost for browser access.
      # For production/external access, adjust to your domain/IP.
      NEXT_PUBLIC_PORTAL_NAME: ${NEXT_PUBLIC_PORTAL_NAME}
      NEXT_PUBLIC_PORTAL_SHORT_NAME: ${NEXT_PUBLIC_PORTAL_SHORT_NAME}
      NEXT_PUBLIC_PORTAL_DESCRIPTION: ${NEXT_PUBLIC_PORTAL_DESCRIPTION}
      NEXT_PUBLIC_PORTAL_LOGIN_TAGLINE: ${NEXT_PUBLIC_PORTAL_LOGIN_TAGLINE}
      NEXT_PUBLIC_PORTAL_LOGO: ${NEXT_PUBLIC_PORTAL_LOGO}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - '3000:3000'
    networks:
      - nagma_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  nagma_network:
    driver: bridge

volumes:
  nagma_data:
    driver: local
